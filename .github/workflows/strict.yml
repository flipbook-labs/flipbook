name: Strict

on:
  pull_request_target:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pull request code stays on this secretless runner. Protected jobs consume
      # only its built artifacts on fresh runners.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Create .env
        run: cp .env.template .env

      - name: Build test place
        run: lute run buildTests --output tests-place.rbxl

      - name: Build smoketest plugin
        run: lute run build plugin --channel prod --clean --output Flipbook.rbxm

      - uses: actions/upload-artifact@v7
        with:
          name: strict-inputs
          path: |
            tests-place.rbxl
            Flipbook.rbxm

  tests:
    needs: build-test-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && 'luau-execution-gated' || 'luau-execution' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Create .env
        run: cp .env.template .env

      - uses: actions/download-artifact@v8
        with:
          name: strict-inputs

      - name: Run tests
        run: lute run runTests --place tests-place.rbxl
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}

      - name: Deploy smoketest plugin to Creator Store
        run: lune run publish-plugin --smoketest --channel prod --skipBuild
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
