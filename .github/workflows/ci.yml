name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
  pull-requests: write

jobs:
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: flipbook-labs/changewrite@v0.16.0
        with:
          require-entry: "true"

  build-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        channel: [dev, beta, prod]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Create .env
        run: cp .env.template .env

      - name: Get model file name
        run: |
          name=$(jq -r .name default.project.json)
          sha=${GITHUB_SHA:0:7}
          echo "MODEL_FILE=$name-$sha.rbxm" >> $GITHUB_ENV

      - name: Build
        run: lute run build plugin --channel ${{ matrix.channel }} --output ${{ env.MODEL_FILE }}

      - uses: actions/upload-artifact@v4
        with:
          name: flipbook-plugin-${{ matrix.channel }}
          path: ${{ env.MODEL_FILE }}

      - uses: actions/attest-build-provenance@v3
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        with:
          subject-path: ${{ env.MODEL_FILE }}

  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        package: [flipbook-core]
        target: [rotriever]
        channel: [dev, beta, prod]
      fail-fast: false
    env:
      ARTIFACT_NAME: ${{ matrix.package }}-${{ matrix.target }}-${{ matrix.channel }}.zip
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Create .env
        run: cp .env.template .env

      - name: Build
        run: lute run build workspace --channel ${{ matrix.channel }} --target ${{ matrix.target }}

      - name: Zip everything up
        run: |
          cd build/
          zip -r ../${{ env.ARTIFACT_NAME }} ${{ matrix.package }}-${{ matrix.target }}

      - uses: actions/attest-build-provenance@v3
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        with:
          subject-path: ${{ env.ARTIFACT_NAME }}

      - uses: actions/upload-artifact@v6
        with:
          path: ${{ env.ARTIFACT_NAME }}
          name: ${{ matrix.package }}-${{ matrix.target }}-${{ matrix.channel }}

  # Runs every PostHog report without credentials, printing the requests the
  # release workflow would send, so changes to them are exercised before they
  # reach main.
  posthog-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@d49be92bd9502180218c3f43e7988faa945217b0 # v0.1.2
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Dry-run PostHog reports
        run: |
          set -euo pipefail
          lute run posthog check --dry-run
          lute run posthog pending-changes --dry-run
          lute run posthog beta-published --dry-run
          lute run posthog prod-released --dry-run
          lute run posthog rolled-back --channel prod --tag v2.4.0 --dry-run
          lute run posthog rolled-back --channel beta --dry-run

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Create .env
        run: cp .env.template .env

      - name: Setup Lute typedefs
        run: lute setup

      - name: Lint
        run: lute run lint

      - name: Run Luau analysis
        run: lute run analyze

      - name: Test the build scripts
        run: lute test .lute

  # Builds everything Flipbook publishes or deploys and reports how big each
  # one is. A pull request from this repository gets the report as a comment,
  # with each size beside the one from the latest report on main.
  size-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@d49be92bd9502180218c3f43e7988faa945217b0 # v0.1.2
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Create .env
        run: cp .env.template .env

      # Every run uploads its report as an artifact, and this compares itself
      # with the newest one from main and takes its history from there.
      - name: Measure every build
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: lute run size-report --compare-with-main --sha "$HEAD_SHA" --run-url "$RUN_URL"

      - name: Add the report to the run summary
        run: cat build/size-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: build/size-report.json

      # Pull requests from forks and from Dependabot get a read-only token, so
      # their report stays in the run summary.
      - name: Comment the report on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: lute run size-report-comment --pr "$PULL_REQUEST_NUMBER"
