name: Upgrade Roblox Packages

on:
  workflow_dispatch:
  schedule:
    # Scheduled to run every week around when Roblox releases new versions of
    # Studio. Usually midday (PST) on Wednesdays. We start this job at 1 PM PST
    # to give some buffer room
    - cron: "0 21 * * 3"

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current-version: ${{ steps.get_current_version.outputs.current-version }}
      latest-version: ${{ steps.get_latest_version.outputs.latest-version }}
      should-upgrade: ${{ steps.get_version_diff.outputs.should-upgrade }}
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0

      - name: Get the latest Roblox Studio version
        id: get_latest_version
        run: |
          latestVersion=$(roblox-packages list | tail -n 1 | awk '{print $1}')
          echo $latestVersion
          echo "latest-version=$latestVersion" >> "$GITHUB_OUTPUT"

      - name: Get current RobloxPackages version
        id: get_current_version
        run: |
          currentVersion=$(grep -o 'ROBLOX_PACKAGES_VERSION = "[^"]*"' project.luau | awk -F'"' '{print $2}')
          echo "current-version=$currentVersion" >> "$GITHUB_OUTPUT"

      - name: Compare RobloxPackages versions
        id: get_version_diff
        run: |
          currentVersion=${{ steps.get_current_version.outputs.current-version }}
          latestVersion=${{ steps.get_latest_version.outputs.latest-version }}

          if [ "$latestVersion" = "$currentVersion" ]; then
            shouldUpgrade=false
          else
            shouldUpgrade=true
          fi

          echo "should-upgrade=$shouldUpgrade" >> "$GITHUB_OUTPUT"

  create-pr:
    needs: [version-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH_NAME: upgrade-roblox-packages
      LATEST_VERSION: ${{ needs.version-check.outputs.latest-version }}
    if: ${{ needs.version-check.outputs.should-upgrade == 'true' }}
    steps:
      # Authenticate as the flipbook-backend GitHub App. Commits and PRs made
      # with this token trigger downstream workflows (CI) without a maintainer
      # having to approve the run, which the default GITHUB_TOKEN cannot do.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLIPBOOK_BACKEND_CLIENT_ID }}
          private-key: ${{ secrets.FLIPBOOK_BACKEND_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          userId=$(gh api "/users/$APP_SLUG[bot]" --jq .id)
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$userId+$APP_SLUG[bot]@users.noreply.github.com"

      - name: Check branch existence
        id: branch_existence
        continue-on-error: true
        run: git ls-remote --exit-code --heads origin ${{ env.BRANCH_NAME }}

      - name: Check out the upgrade branch
        # When an upgrade PR is already in flight we build on top of it instead
        # of recreating it from main. Version bumps can sit open for a while
        # because we're blocked working out the code changes needed to
        # accommodate the new packages, and a destructive rebuild would wipe
        # out that in-progress work. Bumping the version in place and pushing
        # on top keeps those changes intact.
        run: |
          if [ "${{ steps.branch_existence.outcome }}" = "success" ]; then
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            git checkout -B "$BRANCH_NAME" origin/main
          fi

      - name: Apply Version and Changelog Entry
        id: apply
        run: |
          set -euo pipefail

          sed -i "s/ROBLOX_PACKAGES_VERSION = \"[^\"]*\"/ROBLOX_PACKAGES_VERSION = \"$LATEST_VERSION\"/" project.luau

          changelogFile=$(git diff --name-only --diff-filter=A origin/main...HEAD -- '.changes/upgrade-roblox-packages-*.md' | sed -n '1p')
          if [ -z "$changelogFile" ]; then
            changelogFile=".changes/upgrade-roblox-packages-$LATEST_VERSION.md"
          fi

          mkdir -p .changes
          printf '%s\n' \
            '---' \
            'bump: patch' \
            'category: Dependencies' \
            '---' \
            '' \
            "Upgrade RobloxPackages to $LATEST_VERSION." \
            > "$changelogFile"

          echo "changelog_file=$changelogFile" >> "$GITHUB_OUTPUT"

          cat project.luau
          cat "$changelogFile"

      - name: Commit and Push Version Bump
        id: commit
        env:
          CHANGELOG_FILE: ${{ steps.apply.outputs.changelog_file }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- project.luau "$CHANGELOG_FILE")" ]; then
            echo "The branch already tracks $LATEST_VERSION; nothing to push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add project.luau "$CHANGELOG_FILE"
          git commit -m "Upgrade RobloxPackages to $LATEST_VERSION"

          # The new commit is stacked on top of the branch's existing history,
          # so a plain push fast-forwards the remote. We deliberately avoid a
          # force push: if someone pushed to the branch after we fetched it,
          # this push fails rather than clobbering their work, and the job can
          # simply be re-run.
          git push origin "$BRANCH_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: ${{ steps.branch_existence.outcome == 'failure' && steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BODY: |
            This PR upgrades RobloxPackages to **${{ needs.version-check.outputs.latest-version }}**

            >[!IMPORTANT]
            > These changes must be carefully tested in Roblox Studio before merging. The behavior of these packages can and will change out from under us without warning.

            <details>
            <summary>Steps to verify</summary>

            1. Fetch this branch: `git fetch origin ${{ env.BRANCH_NAME }}`
            2. Check it out, reusing and fast-forwarding an existing local branch when present:

               ```sh
               if git show-ref --verify --quiet refs/heads/${{ env.BRANCH_NAME }}; then
                 git switch ${{ env.BRANCH_NAME }}
                 git merge --ff-only origin/${{ env.BRANCH_NAME }}
               else
                 git switch --track origin/${{ env.BRANCH_NAME }}
               fi
               ```

            3. Create the local environment file if needed: `test -f .env || cp .env.template .env`
            4. Install dependencies: `lute run install`
            5. Build: `lute run build plugin --channel dev --clean`
            6. Verify in Roblox Studio that the plugin behaves correctly

            </details>

            _This pull request was generated by [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "[AUTO-GENERATED] Upgrade RobloxPackages to $LATEST_VERSION" \
            --reviewer vocksel \
            --body "$PR_BODY"
