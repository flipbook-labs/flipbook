name: Storybook Preview

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: storybook-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: read

env:
  # Changewrite opens the publish PR from the publish-next-version branch, and
  # its head is the code the next release ships. Other PR previews leave
  # flipbook-rbxm empty, so deploy-storybook embeds the last public Flipbook
  # release. The publish PR embeds its own build instead, so reviewers try what's
  # about to go out. The repository check keeps a fork from getting the same
  # treatment by naming its branch publish-next-version.
  PUBLISH_PR: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.ref == 'publish-next-version' && github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      flipbook-rbxm-url: ${{ steps.flipbook-rbxm.outputs.artifact-url }}
    steps:
      # Pull request code stays on this secretless runner. Protected jobs consume
      # only its built artifacts on fresh runners.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Create .env
        run: cp .env.template .env

      - name: Build storybook place
        run: lute run build storybook

      - name: Build Flipbook runtime
        if: github.event_name != 'pull_request_target' || env.PUBLISH_PR == 'true'
        run: lute run build plugin --channel prod --skip-reload --clean

      - name: Upload Flipbook runtime
        id: flipbook-rbxm
        if: env.PUBLISH_PR == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: build/prod/Flipbook.rbxm
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          name: storybook-inputs
          path: |
            build/flipbook-storybook.rbxl
            build/prod/Flipbook.rbxm

  approve:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && 'luau-execution-gated' || 'luau-execution' }}
    steps:
      - uses: actions/github-script@v9
        with:
          script: core.info('Preview deployment approved')

  deploy:
    needs: [build, approve]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: storybook-preview
    permissions:
      contents: read
      pull-requests: write
    env:
      PREVIEW_PLACE_NAME: Flipbook Preview ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: storybook-inputs
          path: build

      - name: Resolve storybook IDs
        id: ids
        run: |
          set -euo pipefail
          echo "universe-id=$(grep -oP 'ROBLOX_STORYBOOK_UNIVERSE_ID\s*=\s*\K\d+' project.luau)" >> "$GITHUB_OUTPUT"
          echo "place-id=$(grep -oP 'ROBLOX_STORYBOOK_PLACE_ID\s*=\s*\K\d+' project.luau)" >> "$GITHUB_OUTPUT"

      - name: Deploy main storybook
        if: github.event_name != 'pull_request_target'
        uses: flipbook-labs/deploy-storybook@v0.4.0
        with:
          api-key: ${{ secrets.ROBLOX_STORYBOOK_PREVIEW_API_KEY }}
          universe-id: ${{ steps.ids.outputs.universe-id }}
          place-name: Flipbook Stories
          place-id: ${{ steps.ids.outputs.place-id }}
          place-file: build/flipbook-storybook.rbxl
          flipbook-rbxm: build/prod/Flipbook.rbxm
          cli-version: 0.6.0

      - name: Deploy PR storybook
        if: github.event_name == 'pull_request_target'
        uses: flipbook-labs/deploy-storybook@v0.4.0
        with:
          api-key: ${{ secrets.ROBLOX_STORYBOOK_PREVIEW_API_KEY }}
          universe-id: ${{ steps.ids.outputs.universe-id }}
          place-name: ${{ env.PREVIEW_PLACE_NAME }}
          place-file: build/flipbook-storybook.rbxl
          flipbook-rbxm: ${{ env.PUBLISH_PR == 'true' && 'build/prod/Flipbook.rbxm' || '' }}
          cli-version: 0.6.0
          comment: "false"

      - name: Comment preview link
        if: github.event_name == 'pull_request_target'
        run: |
          set -euo pipefail
          flipbook-cli comment \
            --pr "$GITHUB_PULL_REQUEST_NUMBER" \
            --universe-id "$ROBLOX_STORYBOOK_UNIVERSE_ID" \
            --place-name "$ROBLOX_STORYBOOK_PLACE_NAME" \
            --github-repository "$GITHUB_REPOSITORY"

          # The build job uploads Flipbook.rbxm only for the publish PR, so the
          # URL is set only there. flipbook-cli writes the whole comment from a
          # fixed list of links, so this finds that comment by its marker and
          # adds the download link as one more item.
          if [[ -n "$FLIPBOOK_RBXM_URL" ]]; then
            comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$GITHUB_PULL_REQUEST_NUMBER/comments" \
              --jq '.[] | select(.body | contains("<!-- flipbook-pr-preview -->")) | .id' | tail -n 1)
            body=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --jq .body)
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body="$body"$'\n'"* Flipbook.rbxm: $FLIPBOOK_RBXM_URL" > /dev/null
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_STORYBOOK_PREVIEW_API_KEY }}
          ROBLOX_STORYBOOK_UNIVERSE_ID: ${{ steps.ids.outputs.universe-id }}
          ROBLOX_STORYBOOK_PLACE_NAME: ${{ env.PREVIEW_PLACE_NAME }}
          GITHUB_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          FLIPBOOK_RBXM_URL: ${{ needs.build.outputs.flipbook-rbxm-url }}
