name: Storybook Preview

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: storybook-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  # The preview only needs a new deploy when a change touches the `storybook`
  # group in .github/path-filters.yml. On pull requests, this reads the group
  # from the base branch and lists changed files through the API, so it never
  # runs pull request code.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      storybook: ${{ steps.filter.outputs.storybook }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml

  build:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pull request code stays on this secretless runner. Protected jobs consume
      # only its built artifacts on fresh runners.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Create .env
        run: cp .env.template .env

      - name: Build storybook place
        run: lute run build storybook

      - name: Build Flipbook runtime
        # This runner has no secrets, so building a pull request's Flipbook here
        # is safe. The deploy job embeds it only in the PR build's place, after
        # the `approve` job's environment gate.
        run: lute run build plugin --channel prod --skip-reload --clean

      - uses: actions/upload-artifact@v7
        with:
          name: storybook-inputs
          path: |
            build/flipbook-storybook.rbxl
            build/prod/Flipbook.rbxm

  approve:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && 'luau-execution-gated' || 'luau-execution' }}
    steps:
      - uses: actions/github-script@v9
        with:
          script: core.info('Preview deployment approved')

  deploy:
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: storybook-preview
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_BUILD_PLACE_NAME: Flipbook Preview ${{ github.event.pull_request.number }} PR Flipbook
      RELEASE_PLACE_NAME: Flipbook Preview ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: storybook-inputs
          path: build

      - name: Resolve storybook IDs
        id: ids
        run: |
          set -euo pipefail
          echo "universe-id=$(grep -oP 'ROBLOX_STORYBOOK_UNIVERSE_ID\s*=\s*\K\d+' project.luau)" >> "$GITHUB_OUTPUT"
          echo "place-id=$(grep -oP 'ROBLOX_STORYBOOK_PLACE_ID\s*=\s*\K\d+' project.luau)" >> "$GITHUB_OUTPUT"

      - name: Deploy main storybook
        if: github.event_name != 'pull_request_target'
        uses: flipbook-labs/deploy-storybook@v0.4.1
        with:
          api-key: ${{ secrets.ROBLOX_STORYBOOK_PREVIEW_API_KEY }}
          universe-id: ${{ steps.ids.outputs.universe-id }}
          place-name: Flipbook Stories
          place-id: ${{ steps.ids.outputs.place-id }}
          place-file: build/flipbook-storybook.rbxl
          flipbook-rbxm: build/prod/Flipbook.rbxm
          cli-version: 0.7.0

      - name: Deploy PR stories with the PR's Flipbook
        if: github.event_name == 'pull_request_target'
        uses: flipbook-labs/deploy-storybook@v0.4.1
        with:
          api-key: ${{ secrets.ROBLOX_STORYBOOK_PREVIEW_API_KEY }}
          universe-id: ${{ steps.ids.outputs.universe-id }}
          place-name: ${{ env.PR_BUILD_PLACE_NAME }}
          place-file: build/flipbook-storybook.rbxl
          flipbook-rbxm: build/prod/Flipbook.rbxm
          cli-version: 0.7.0
          comment: "false"

      - name: Deploy PR stories with released Flipbook
        if: github.event_name == 'pull_request_target'
        uses: flipbook-labs/deploy-storybook@v0.4.1
        with:
          api-key: ${{ secrets.ROBLOX_STORYBOOK_PREVIEW_API_KEY }}
          universe-id: ${{ steps.ids.outputs.universe-id }}
          place-name: ${{ env.RELEASE_PLACE_NAME }}
          place-file: build/flipbook-storybook.rbxl
          cli-version: 0.7.0
          comment: "false"

      # The comment's buttons and QR code open the PR build's place. Its
      # template adds a link to the release place, so a reviewer can tell
      # whether a difference comes from this PR's Flipbook or from the Stories.
      # Lute and flipbook-cli come from the deploy-storybook action above. It
      # sets up Rokit, which installs the tools in rokit.toml, and adds
      # flipbook-cli.
      - name: Comment preview links
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_STORYBOOK_PREVIEW_API_KEY }}
          UNIVERSE_ID: ${{ steps.ids.outputs.universe-id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          release_place_id=$(lute run resolve-place-id "$UNIVERSE_ID" "$RELEASE_PLACE_NAME")
          template=$(cat <<EOF
          These Stories run on the Flipbook this pull request builds.

          {{launchButton}} {{experienceButton}}

          To see them on the released Flipbook, [launch the release preview ↗](https://www.roblox.com/games/start?placeId=$release_place_id).

          <details>
          <summary>📱 Preview on mobile</summary>

          Scan to join the preview in the Roblox app.

          {{qrCodeMarkdown}}

          </details>
          EOF
          )
          flipbook-cli comment \
            --pr "$PR_NUMBER" \
            --universe-id "$UNIVERSE_ID" \
            --place-name "$PR_BUILD_PLACE_NAME" \
            --github-repository "$GITHUB_REPOSITORY" \
            --comment-template "$template"
