name: Storybook Preview

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: storybook-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: storybook-preview
    env:
      PREVIEW_PLACE_NAME: "Flipbook Preview ${{ github.event.pull_request.number }}"
      PREVIEW_SEARCH_TERM: "RobloxProfile|SuccessDialog"
      PREVIEW_STORY_PATH: "FlipbookCore/About/RobloxProfile"

    steps:
      - uses: actions/checkout@v6

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Create .env
        run: cp .env.template .env

      - name: Resolve storybook IDs
        id: ids
        run: |
          echo "universe-id=$(grep -oP 'ROBLOX_STORYBOOK_UNIVERSE_ID\s*=\s*\K\d+' project.luau)" >> "$GITHUB_OUTPUT"
          echo "place-id=$(grep -oP 'ROBLOX_STORYBOOK_PLACE_ID\s*=\s*\K\d+' project.luau)" >> "$GITHUB_OUTPUT"

      - name: Build storybook place
        run: lute run build storybook

      # Build the runtime from the checked-out revision so preview links exercise
      # the same Flipbook code as the branch that produced the storybook.
      - name: Build Flipbook runtime
        run: lute run build plugin --channel prod --skip-reload --clean

      - name: Deploy main storybook
        if: github.event_name == 'push'
        uses: flipbook-labs/deploy-storybook@v0.4.0
        with:
          api-key: ${{ secrets.ROBLOX_STORYBOOK_PREVIEW_API_KEY }}
          universe-id: ${{ steps.ids.outputs.universe-id }}
          place-name: "Flipbook Stories"
          place-id: ${{ steps.ids.outputs.place-id }}
          place-file: build/flipbook-storybook.rbxl
          flipbook-rbxm: build/prod/Flipbook.rbxm
          cli-version: "0.6.0"

      - name: Deploy PR storybook
        if: github.event_name == 'pull_request'
        uses: flipbook-labs/deploy-storybook@v0.4.0
        with:
          api-key: ${{ secrets.ROBLOX_STORYBOOK_PREVIEW_API_KEY }}
          universe-id: ${{ steps.ids.outputs.universe-id }}
          place-name: ${{ env.PREVIEW_PLACE_NAME }}
          place-file: build/flipbook-storybook.rbxl
          flipbook-rbxm: build/prod/Flipbook.rbxm
          cli-version: "0.6.0"

      # Preview state is carried in Roblox launch data, so the PR comment's
      # launch link includes the same example used for acceptance testing.
      - name: Add search to PR preview link
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- flipbook-pr-preview -->")) | .id' | tail -1)"
          test -n "$comment_id"

          launch_data="$(jq -nr --arg search "$PREVIEW_SEARCH_TERM" --arg story_path "$PREVIEW_STORY_PATH" \
            '{ search: $search, story: $story_path } | tojson | @uri')"
          body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --jq .body)"
          updated_body="$(printf '%s' "$body" | sed -E \
            "s#(\\* Launch: https://www\\.roblox\\.com/games/start\\?placeId=[0-9]+)(\&launchData=[^[:space:]]+)?#\\1\&launchData=$launch_data#")"

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
            --raw-field body="$updated_body"
