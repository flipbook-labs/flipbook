name: Storybook Preview

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request whose preview places should be updated
        required: true
        type: number
      head_sha:
        description: Pull request commit to build
        required: true
        type: string

concurrency:
  group: storybook-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pull request code stays on this secretless runner. Protected jobs consume
      # only its built artifacts on fresh runners.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Create .env
        run: cp .env.template .env

      - name: Build storybook place
        run: lute run build storybook

      - name: Build Flipbook runtime
        run: lute run build plugin --channel prod --skip-reload --clean

      - uses: actions/upload-artifact@v7
        with:
          name: storybook-inputs
          path: |
            build/flipbook-storybook.rbxl
            build/prod/Flipbook.rbxm

  approve:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && 'luau-execution-gated' || 'luau-execution' }}
    steps:
      - uses: actions/github-script@v9
        with:
          script: core.info('Preview deployment approved')

  deploy:
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: storybook-preview
    permissions:
      contents: read
      pull-requests: write
    env:
      PREVIEW_PLACE_NAME: Flipbook Preview ${{ github.event.pull_request.number || inputs.pull_request_number }}
      PR_RUNTIME_PLACE_NAME: Flipbook Preview ${{ github.event.pull_request.number || inputs.pull_request_number }} PR Flipbook
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: storybook-inputs
          path: build

      - name: Resolve storybook IDs
        id: ids
        run: |
          set -euo pipefail
          echo "universe-id=$(grep -oP 'ROBLOX_STORYBOOK_UNIVERSE_ID\s*=\s*\K\d+' project.luau)" >> "$GITHUB_OUTPUT"
          echo "place-id=$(grep -oP 'ROBLOX_STORYBOOK_PLACE_ID\s*=\s*\K\d+' project.luau)" >> "$GITHUB_OUTPUT"

      - name: Deploy main storybook
        if: github.event_name == 'push'
        uses: flipbook-labs/deploy-storybook@v0.4.0
        with:
          api-key: ${{ secrets.ROBLOX_STORYBOOK_PREVIEW_API_KEY }}
          universe-id: ${{ steps.ids.outputs.universe-id }}
          place-name: Flipbook Stories
          place-id: ${{ steps.ids.outputs.place-id }}
          place-file: build/flipbook-storybook.rbxl
          flipbook-rbxm: build/prod/Flipbook.rbxm
          cli-version: 0.6.0

      - name: Deploy PR stories with released Flipbook
        if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch'
        uses: flipbook-labs/deploy-storybook@v0.4.0
        with:
          api-key: ${{ secrets.ROBLOX_STORYBOOK_PREVIEW_API_KEY }}
          universe-id: ${{ steps.ids.outputs.universe-id }}
          place-name: ${{ env.PREVIEW_PLACE_NAME }}
          place-file: build/flipbook-storybook.rbxl
          cli-version: 0.6.0
          comment: 'false'

      - name: Deploy PR stories with pull request Flipbook
        if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch'
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_STORYBOOK_PREVIEW_API_KEY }}
          ROBLOX_STORYBOOK_UNIVERSE_ID: ${{ steps.ids.outputs.universe-id }}
        run: |
          set -euo pipefail
          flipbook-cli deploy \
            --universe-id "$ROBLOX_STORYBOOK_UNIVERSE_ID" \
            --place-name "$PR_RUNTIME_PLACE_NAME" \
            --place-file build/flipbook-storybook.rbxl \
            --flipbook-rbxm build/prod/Flipbook.rbxm

      - name: Comment preview links
        if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_STORYBOOK_PREVIEW_API_KEY }}
          ROBLOX_STORYBOOK_UNIVERSE_ID: ${{ steps.ids.outputs.universe-id }}
          RELEASE_RUNTIME_PLACE_NAME: ${{ env.PREVIEW_PLACE_NAME }}
          PR_RUNTIME_PLACE_NAME: ${{ env.PR_RUNTIME_PLACE_NAME }}
          GITHUB_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        with:
          script: |
            const comment = require('./.github/scripts/comment-storybook-preview.cjs')
            await comment({ github, context })
